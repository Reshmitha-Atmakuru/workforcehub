version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: workforce-mysql
    environment:
      MYSQL_DATABASE: workforce_hub
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: workforce_user
      MYSQL_PASSWORD: workforce_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always

  app:
    build: .
    container_name: workforce-backend
    ports:
      - "3000:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/workforce_hub?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=workforce_user
      - SPRING_DATASOURCE_PASSWORD=workforce_password
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      - mysql
    restart: always

volumes:
  mysql_data:
